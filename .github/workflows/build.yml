name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Gradle runs on this JDK; the Java 17 compile/test toolchain is provisioned by Gradle (foojay resolver).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The opt-in corpus test (-Dfl.corpus) is not given a property here, so it does not run.
      - name: Build, test and package
        run: ./gradlew build buildPlugin --stacktrace

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin --stacktrace

      - name: Upload plugin zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: build/distributions/*.zip
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: warn

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-reports
          path: build/reports/pluginVerifier/
          if-no-files-found: ignore
